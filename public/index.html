<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>图书馆研发工作台</title>
<style>
:root{
  --blue:#2563EB;--blue-lt:#DBEAFE;--blue-bg:#EFF6FF;
  --teal:#0D9488;--teal-lt:#CCFBF1;--teal-bg:#F0FDFA;
  --amber:#D97706;--amber-lt:#FEF3C7;--amber-bg:#FFFBEB;
  --bg:#F8FAFC;--card:#FFFFFF;--text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:#E2E8F0;--border-lt:#F1F5F9;
  --danger:#EF4444;--danger-bg:#FEF2F2;
  --success:#10B981;--warn:#F59E0B;
  --shadow:0 1px 2px rgba(0,0,0,.04);--shadow-card:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --radius:10px;--radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
input[type="text"],input[type="date"],input[type="number"],select,textarea{font-size:16px!important}

/* ── Top Bar ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;white-space:nowrap}
.ver-badge{font-size:10px;font-weight:600;color:#2563EB;background:#DBEAFE;border:1px solid #BFDBFE;border-radius:6px;padding:1px 6px;line-height:1.6}
.topbar-actions{display:flex;gap:6px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text2);transition:all .15s;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--border-lt)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#1D4ED8}
.btn-ghost{border-color:transparent}
.btn-sm{padding:4px 9px;font-size:12px;min-height:30px;border-radius:4px}
.btn svg{width:15px;height:15px;flex-shrink:0}

/* ── Stats Row ── */
.stats-row{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stats-row::-webkit-scrollbar{display:none}
.stat-card{flex:1;min-width:70px;background:var(--card);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);text-align:center;border:1px solid var(--border-lt)}
.stat-card .num{font-size:22px;font-weight:800;line-height:1.2}
.stat-card .label{font-size:11px;color:var(--text3);margin-top:2px}
.stat-card.danger .num{color:var(--danger)}
.stat-card.active .num{color:var(--blue)}
.stat-card.done .num{color:var(--success)}

/* ── Tabs ── */
.tabs{display:flex;gap:0;padding:4px 16px;position:sticky;top:52px;z-index:50;background:var(--bg)}
.tab-btn{flex:1;padding:9px 0;text-align:center;font-size:14px;font-weight:600;color:var(--text3);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-height:40px}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ── Kanban Board ── */
.kanban{padding:8px 16px 16px;display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:200px}
.kanban::-webkit-scrollbar{display:none}
.column{min-width:280px;max-width:360px;flex:1;display:flex;flex-direction:column;gap:8px}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
.col-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.col-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.col-count{font-size:12px;color:var(--text3);background:var(--border-lt);padding:2px 8px;border-radius:10px}
.col-new{display:flex;align-items:center;justify-content:center;padding:12px;border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--text3);font-size:13px;cursor:pointer;transition:all .15s;min-height:44px}
.col-new:hover{color:var(--blue);border-color:var(--blue);background:var(--blue-bg)}

/* ── Kanban Card ── */
.kcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-card);border:1px solid var(--border-lt);padding:12px;cursor:grab;transition:all .15s;touch-action:pan-y;user-select:none}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.45;border:2px dashed var(--blue);transform:scale(.97);box-shadow:none}
.kcard.drag-hint{border-top:3px solid var(--blue);border-radius:4px}
.kcard-drag{color:var(--text3);font-size:11px;letter-spacing:-2px;cursor:grab;padding:0 2px;flex-shrink:0;line-height:1.6;user-select:none;touch-action:none}
.kcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kcard.overdue{border-left:3px solid var(--danger)}
.kcard.soon{border-left:3px solid var(--warn)}
.kcard.paused{opacity:.6}
.kcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.kcard-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;flex:1;min-width:0}
.kcard-prio{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0}
.kcard-prio.P0{background:#FEE2E2;color:#DC2626}
.kcard-prio.P1{background:#FEF3C7;color:#D97706}
.kcard-prio.P2{background:#F1F5F9;color:#64748B}
.kcard-body{display:flex;flex-direction:column;gap:6px}
.kcard-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.kcard-row svg{width:13px;height:13px;flex-shrink:0}
.kcard-progress{display:flex;align-items:center;gap:8px}
.kcard-progress-bar{flex:1;height:5px;background:var(--border-lt);border-radius:3px;overflow:hidden}
.kcard-progress-fill{height:100%;border-radius:3px;transition:width .3s}
.kcard-progress-txt{font-size:12px;font-weight:700;color:var(--text2);min-width:32px;text-align:right}
/* milestone dots */
.kcard-mstones{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.mstone-dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mstone-dot.done{background:var(--success)}
.mstone-dot.future{background:var(--text3)}
.kcard-date{font-size:11px;color:var(--text3);margin-top:2px}

/* ── Detail Panel ── */
.detail-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.detail-overlay.open{display:flex}
.detail-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.detail-panel{position:relative;width:100%;max-width:600px;max-height:88vh;background:var(--card);border-radius:16px 16px 0 0;overflow-y:auto;padding:20px;z-index:1}
.detail-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2)}
.detail-title{font-size:18px;font-weight:700;margin-bottom:14px;padding-right:40px}
.detail-field{margin-bottom:12px}
.detail-field label{display:block;font-size:12px;color:var(--text3);margin-bottom:3px}
.detail-field .val{font-size:14px;color:var(--text);font-weight:600}
.detail-progress{display:flex;align-items:center;gap:10px;margin:12px 0}
.detail-progress-bar{flex:1;height:8px;background:var(--border-lt);border-radius:4px;overflow:hidden}
.detail-progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.detail-progress-val{font-size:14px;font-weight:700}
.detail-mstones{margin-top:8px}
.detail-mstone{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-lt);font-size:13px}
.detail-mstone .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex-shrink:0}
.detail-mstone .dot.past{background:var(--success)}
.detail-mstone .dot.future{background:var(--text3)}
.detail-actions{display:flex;gap:8px;margin-top:16px}

/* ── Gantt ── */
.gantt-wrap{padding:8px 16px;display:none}
.gantt-wrap.active{display:block}
.gantt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);background:var(--card);border:1px solid var(--border-lt)}
.gantt-legend{display:flex;gap:16px;padding:6px 16px 10px}
.gantt-legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}

/* ── Task List ── */
.task-wrap{padding:8px 16px;display:none}
.task-wrap.active{display:block}
.task-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.task-filter .chip{padding:5px 12px;border:1px solid var(--border);border-radius:14px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;min-height:32px}
.task-filter .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.task-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:8px;border:1px solid var(--border-lt)}
.task-card.overdue{border-left:3px solid var(--danger)}
.task-card .task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.task-card .task-name{font-size:14px;font-weight:600;flex:1}
.task-card .task-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:12px;color:var(--text2)}
.task-card .task-project{font-size:12px;font-weight:600;margin-top:4px}
/* 任务级工时登记与完成按钮 */
.task-card .task-hours{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid rgba(37,99,235,.2);padding:1px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.btn-sm.task-complete-btn{background:var(--success);border-color:var(--success);color:#fff;font-weight:600}
.btn-sm.task-done-btn{border-color:var(--success);color:var(--success);font-weight:600}
.btn-sm.wl-btn{border-color:var(--blue);color:var(--blue);font-weight:600}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.modal-box{position:relative;width:100%;max-width:560px;max-height:90vh;background:var(--card);border-radius:16px 16px 0 0;overflow-y:auto;padding:24px;z-index:1}
.modal-box h3{font-size:17px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--text);outline:none;transition:all .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.milestone-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.milestone-row input{flex:1}
.milestone-row button{flex-shrink:0}
.modal-footer{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* ── Floating Button ── */
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:16px;z-index:90;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:none;box-shadow:0 4px 12px rgba(37,99,235,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.fab:hover{transform:scale(1.05)}
.fab svg{width:24px;height:24px}

/* ── Bottom Nav (Mobile) ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0;border:none;background:transparent;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;min-height:56px;transition:all .15s}
.bottom-nav button.active{color:var(--blue)}
.bottom-nav button svg{width:22px;height:22px}

/* ── Stats View ── */
.stats-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:4px}
.scard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 10px;text-align:center;border:1px solid var(--border-lt)}
.scard.done{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.scard.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04)}
.scard.danger{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}
.scard-num{font-size:22px;font-weight:800;color:var(--text)}
.scard-label{font-size:11px;color:var(--text3);margin-top:2px}

.person-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:8px;border:1px solid var(--border-lt)}
.person-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.person-name{font-size:14px;font-weight:700;color:var(--text)}
.person-rate{font-size:18px;font-weight:800}
.person-bar-wrap{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px}
.person-bar{border-radius:0;transition:width .4s}
.person-bar.pending{background:#CBD5E1}
.person-bar.inprog{background:#F59E0B}
.person-bar.done{background:#10B981}
.person-stats{display:flex;gap:12px;font-size:12px;color:var(--text2);flex-wrap:wrap}

.proj-stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:8px;border:1px solid var(--border-lt)}
.proj-stat-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj-stat-name{font-size:14px;font-weight:700;color:var(--text);flex:1;min-width:0}
.proj-stat-cat{font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px}

@media(max-width:767px){
  .stats-cards{grid-template-columns:repeat(3,1fr)}
  .scard-num{font-size:18px}
}
/* ── Empty State ── */
.empty{padding:32px 16px;text-align:center;color:var(--text3);font-size:14px}
.empty svg{width:40px;height:40px;margin-bottom:8px;color:var(--text3)}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:400;padding:10px 20px;background:#0F172A;color:#fff;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}

/* ── Sync Indicator ── */
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sync-offline{background:#DC2626}
.sync-syncing{background:#F59E0B;animation:pulse 1s infinite}
.sync-online{background:#16A34A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Responsive: PC ── */
@media(min-width:1024px){
  .kanban{gap:16px;padding:12px 24px 20px}
  .topbar{padding:10px 24px}
  .tabs{padding:4px 24px}
  .stats-row{padding:12px 24px 8px}
  .column{min-width:300px;flex:1}
  .fab{display:none}
  .bottom-nav{display:none}
  body{padding-bottom:0}
  .detail-panel{border-radius:16px;margin:auto;max-height:80vh}
  .modal-box{border-radius:16px;margin:auto;max-height:80vh}
}

/* ── Responsive: Tablet ── */
@media(min-width:768px) and (max-width:1023px){
  .kanban{gap:14px;padding:10px 20px 16px}
  .topbar{padding:10px 20px}
  .tabs{padding:4px 20px}
  .stats-row{padding:10px 20px 8px}
  .column{min-width:260px}
}

/* ── Responsive: Mobile ── */
@media(max-width:767px){
  .kanban{flex-direction:column;overflow-x:hidden;padding:8px 12px 16px}
  .column{min-width:auto;max-width:none}
  .tabs{padding:4px 12px}
  .stats-row{padding:10px 12px 6px;gap:6px}
  .topbar{padding:10px 12px}
}

/* ── Today Section (redesigned) ── */
.today-wrap{padding:0 16px 8px;display:none}
.today-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border-lt);overflow:hidden}
.today-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.today-header-left{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.today-badge{font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;min-width:18px;text-align:center}
.today-arrow{transition:transform .2s}
.today-header.open .today-arrow{transform:rotate(180deg)}
.today-body{display:none;padding:0 12px 10px}
.today-header.open+.today-body{display:block}
.today-item{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:5px;border-radius:6px;font-size:13px;border-left:3px solid transparent}
.today-item.overdue{background:var(--danger-bg);border-left-color:var(--danger)}
.today-item.tdy{background:#FFFBEB;border-left-color:var(--warn)}
.today-item.soon{background:var(--blue-bg);border-left-color:var(--blue)}
.today-item .td-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.today-item .td-tag.overdue{background:#FEE2E2;color:var(--danger)}
.today-item .td-tag.tdy{background:#FEF3C7;color:var(--amber)}
.today-item .td-tag.soon{background:var(--blue-lt);color:var(--blue)}
.today-item .td-info{flex:1;min-width:0}
.today-item .td-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item .td-sub{font-size:11px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item .td-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:28px;color:var(--text2);transition:all .15s;flex-shrink:0}
.today-item .td-btn:hover{background:var(--border-lt)}
.today-item .td-btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.today-actions{display:flex;gap:6px;padding:8px 0 0;border-top:1px solid var(--border-lt);margin-top:4px}
.today-empty{padding:14px;text-align:center;color:var(--text3);font-size:13px}

/* ── Workload ── */
.wl-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.wl-bar{flex:1;height:4px;background:var(--border-lt);border-radius:2px;overflow:hidden;display:flex}
.wl-fill{height:100%;border-radius:2px;background:var(--amber);transition:width .3s}
.wl-txt{font-size:10px;color:var(--text3);white-space:nowrap}

/* ── Form Sections ── */
.form-section{margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--border-lt)}
.form-section:first-of-type{border-top:none;padding-top:0;margin-top:0}
.form-section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.form-section-title svg{width:14px;height:14px;color:var(--blue)}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.4}
.form-hint.warn{color:var(--amber)}
.toggle-group{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:4px}
.toggle-btn{flex:1;padding:6px 10px;font-size:12px;font-weight:600;border:none;background:var(--card);color:var(--text3);cursor:pointer;transition:all .15s;min-height:34px}
.toggle-btn.active{background:var(--blue);color:#fff}
.auto-calc-hint{font-size:11px;color:var(--text3);margin-top:4px;display:flex;align-items:flex-start;gap:4px;line-height:1.4}
.auto-calc-hint svg{width:12px;height:12px;flex-shrink:0;margin-top:2px}
.auto-calc-hint.ok{color:var(--success)}
.auto-calc-hint.warn{color:var(--amber)}
.input-disabled{opacity:.5;pointer-events:none}
.form-group label .label-badge{font-size:10px;font-weight:400;color:var(--text3);margin-left:4px;padding:1px 6px;background:var(--border-lt);border-radius:8px}
.wl-person-chip{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;transition:opacity .15s}

<script>
// ═══════════════════ DATA ═══════════════════
var DATA_VERSION=2;
var LS_PROJ='wb_lib_proj_v2', LS_TASK='wb_lib_task_v2', LS_WL='wb_lib_worklog_v2', LS_VER='wb_lib_ver';
var projects=[], tasks=[], worklogs=[], currentTab='kanban', taskFilter='all', taskNameFilter='all';
var editingProjId=null, editingMilestones=[], _autoSaveTimer=null;
var _syncStatus='offline', _syncTimer=null;

// 保存到 localStorage
function saveLocal(){
  localStorage.setItem(LS_PROJ,JSON.stringify(projects));
  localStorage.setItem(LS_TASK,JSON.stringify(tasks));
  localStorage.setItem(LS_WL,JSON.stringify(worklogs||[]));
  localStorage.setItem(LS_VER,String(DATA_VERSION));
}

// 保存：本地 + 服务端双写
// immediate=true 时立即推送（删除/保存等关键操作），否则 2 秒防抖
function saveData(immediate){
  saveLocal();
  if(immediate) _pushToServer();
  else scheduleServerSync();
}

// 加载本地数据（秒开）
function loadData(){
  var p=localStorage.getItem(LS_PROJ), t=localStorage.getItem(LS_TASK), v=localStorage.getItem(LS_VER), wl=localStorage.getItem(LS_WL);
  if(p) projects=JSON.parse(p); if(t) tasks=JSON.parse(t);
  if(wl) worklogs=JSON.parse(wl);
  if(!Array.isArray(worklogs)) worklogs=[];
  // 版本迁移：V1 → V2，为旧项目补上 workDays 字段
  var oldVer=parseInt(v)||1;
  if(oldVer<2){
    projects.forEach(function(pr){
      if(pr.workDaysPlanned===undefined) pr.workDaysPlanned=0;
      if(pr.workDaysUsed===undefined) pr.workDaysUsed=0;
    });
    saveData();
  }
  // 为旧项目补上自动计算字段（默认开启）
  projects.forEach(function(pr){
    if(pr.autoProgress===undefined) pr.autoProgress=true;
    if(pr.autoWorkDays===undefined) pr.autoWorkDays=true;
  });
  // 应用自动计算
  refreshAllAutoCalc();
}

// ═══════════════════ API 同步 ═══════════════════
// 自动检测后端是否在线；离线时仅使用 localStorage
// 用户可手动配置后台地址以便多设备共享数据

var _serverOnline = false;
var _serverUrl = localStorage.getItem('wb_lib_server') || 'https://library-rd-workbench-server-production.up.railway.app';

function getServerUrl(){ return _serverUrl; }

// 启动时探测后端是否可用
function probeServer(callback){
  var url = getServerUrl() + '/api/health';
  fetch(url, {method:'GET',cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(){
      _serverOnline = true;
      _setSyncStatus('online');
      console.log('[backend] 已连接');
      if(callback) callback(true);
    })
    .catch(function(){
      _serverOnline = false;
      _setSyncStatus('offline');
      console.log('[backend] 未连接，使用本地存储');
      if(callback) callback(false);
    });
}

// 从服务端拉取数据（服务端优先）
function syncFromServer(callback){
  if(!_serverOnline){ if(callback) callback(false); return; }
  _setSyncStatus('syncing');
  fetch(getServerUrl()+'/api/data', {method:'GET',cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(data){
      if(data.projects && data.tasks){
        projects = data.projects;
        tasks = data.tasks;
        if(Array.isArray(data.worklogs)) worklogs = data.worklogs;
        // 补全自动计算字段
        projects.forEach(function(pr){
          if(pr.autoProgress===undefined) pr.autoProgress=true;
          if(pr.autoWorkDays===undefined) pr.autoWorkDays=true;
        });
        refreshAllAutoCalc();
        saveLocal();
        _setSyncStatus('online');
      }
      if(callback) callback(true);
    })
    .catch(function(){
      _serverOnline = false;
      _setSyncStatus('offline');
      if(callback) callback(false);
    });
}

// 防抖推送到服务端
function scheduleServerSync(){
  if(!_serverOnline) return;
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ _pushToServer(); }, 2000);
}

function _pushToServer(){
  if(!_serverOnline) return;
  _setSyncStatus('syncing');
  fetch(getServerUrl()+'/api/data', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({projects:projects, tasks:tasks, worklogs:worklogs||[]})
  })
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(){ _setSyncStatus('online'); })
  .catch(function(){ _serverOnline=false; _setSyncStatus('offline'); });
}

function forceSync(){
  if(!_serverOnline){ toast('后端未连接，请先配置后台地址'); showBackendConfig(); return; }
  toast('正在同步...');
  syncFromServer(function(ok){
    renderAll();
    toast(ok?'同步完成 ✓':'同步失败');
  });
}

// 后台地址配置弹窗
function showBackendConfig(){
  var url = prompt('请输入后台服务地址：\n\n例如：http://192.168.1.100:3000\n或：https://your-server.com\n\n留空则仅使用本地存储。', _serverUrl || '');
  if(url===null) return; // 取消
  url = url.trim().replace(/\/+$/,'');
  if(url){
    localStorage.setItem('wb_lib_server', url);
    _serverUrl = url;
    _serverOnline = false;
    toast('正在连接后台...');
    probeServer(function(ok){
      if(ok){
        toast('后台已连接 ✓');
        syncFromServer(function(){ renderAll(); });
      } else {
        toast('无法连接后台，请检查地址');
      }
    });
  } else {
    localStorage.removeItem('wb_lib_server');
    _serverUrl = '';
    _serverOnline = false;
    _setSyncStatus('offline');
    toast('已切换为本地存储模式');
  }
}

function _setSyncStatus(s){
  _syncStatus = s;
  var el = document.getElementById('syncDot');
  if(!el) return;
  el.className = 'sync-dot sync-'+s;
  var labels = {online:'已同步到后台',syncing:'同步中',offline:'本地存储'};
  el.title = labels[s] || '';
}

// 自动保存：表单输入时 1.5 秒后自动写入 localStorage（仅备份草稿，不触发 UI 刷新）
function scheduleAutoSave(){ clearTimeout(_autoSaveTimer); _autoSaveTimer=setTimeout(autoSaveDraft,1500); }
function autoSaveDraft(){
  // 收集模态框表单数据
  var nameEl=document.getElementById('modPName');
  if(!nameEl) return; // 模态框未打开
  // 同步里程碑输入
  syncMilestonesSilent();
  var draft={
    version:DATA_VERSION,
    name:(nameEl.value||'').trim(),
    category:(document.getElementById('modPCat')||{}).value||'',
    status:(document.getElementById('modPStatus')||{}).value||'',
    priority:(document.getElementById('modPPrio')||{}).value||'',
    owner:(document.getElementById('modPOwner')||{}).value||'',
    startDate:(document.getElementById('modPStart')||{}).value||'',
    endDate:(document.getElementById('modPEnd')||{}).value||'',
    progress:parseInt((document.getElementById('modPProg')||{}).value)||0,
    desc:(document.getElementById('modPDesc')||{}).value||'',
    workDaysPlanned:parseInt((document.getElementById('modPWPlan')||{}).value)||0,
    workDaysUsed:parseFloat((document.getElementById('modPWUsed')||{}).value)||0,
    milestones:editingMilestones,
    autoProgress:_autoProg,
    autoWorkDays:_autoWork
  };
  // 如果正在编辑已有项目，则实时更新到数组
  if(editingProjId){
    var idx=projects.findIndex(function(x){return x.id===editingProjId;});
    if(idx>=0){ draft.id=editingProjId; projects[idx]=draft; saveLocal(); scheduleServerSync(); }
  }
  // 草稿存到单独的 key
  localStorage.setItem('wb_lib_draft',JSON.stringify({editingProjId:editingProjId,data:draft,timestamp:Date.now()}));
}

function syncMilestonesSilent(){
  try{
    document.querySelectorAll('#modMilestones input').forEach(function(inp){
      var i=parseInt(inp.dataset.mi), field=inp.dataset.field;
      if(!isNaN(i) && editingMilestones[i]) editingMilestones[i][field]=inp.value;
    });
  }catch(e){}
}

function genId(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ if(!s||typeof s!=='string') return new Date(NaN); var p=s.split('-'); if(p.length!==3) return new Date(NaN); return new Date(+p[0],+p[1]-1,+p[2]); }
function isValidDate(d){ return d instanceof Date && !isNaN(d.getTime()); }
function bizDaysBetween(sd,ed){ if(!isValidDate(sd)||!isValidDate(ed)||sd>ed) return 0; var n=0,d=new Date(sd); while(d<=ed){ var w=d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); } return n; }
function daysBetween(sd,ed){ if(!isValidDate(sd)||!isValidDate(ed)) return 0; return Math.round((ed-sd)/(1000*60*60*24)); }
function daysUntil(s){ if(!s) return 9999; var t=new Date(); t.setHours(0,0,0,0); var d=parseDate(s); if(isNaN(d.getTime())) return 9999; return Math.ceil((d-t)/(1000*60*60*24)); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function es(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ── Auto-Calculation (参考 Jira/Linear/Asana 成熟方案) ── */
// 混合模式进度计算：优先按工时登记（E×70%+T×30%），其次任务完成率，最后时间进度
function autoCalcProgress(pid){
  var p=projects.find(function(x){return x.id===pid;}); if(!p) return -1;
  // ① 有工时登记且有计划工时 → 综合工作进度（工时为主、时间为辅）
  var blended=calcBlendedPct(p);
  if(blended>=0 && hoursUsedOfProject(pid)>0) return blended;
  // ② 无登记但有任务 → 按任务完成率
  var pt=tasks.filter(function(t){return t.projectId===pid;});
  if(pt.length>0){
    var done=pt.filter(function(t){return t.status==='已完成';}).length;
    return Math.round(done/pt.length*100);
  }
  // ③ 无登记无任务 → 时间进度推算
  if(p.startDate&&p.endDate){
    var sd=parseDate(p.startDate),ed=parseDate(p.endDate);
    if(isValidDate(sd)&&isValidDate(ed)){
      var today=new Date(); today.setHours(0,0,0,0);
      if(today<=sd) return 0;
      if(today>=ed) return 100;
      var total=daysBetween(sd,ed),elapsed=daysBetween(sd,today);
      return Math.round(elapsed/total*100);
    }
  }
  return -1;
}
// 计划工作日 = 开始到截止的工作日数（不含周末）
function autoCalcWorkDaysPlanned(p){
  if(!p.startDate||!p.endDate) return 0;
  return bizDaysBetween(parseDate(p.startDate),parseDate(p.endDate));
}
// 已用工作日 = 项目累计登记工时折算（7.5 小时 = 1 天）；无登记工时则默认 0
function autoCalcWorkDaysUsed(p){
  var logged=hoursUsedOfProject(p.id);
  return logged>0 ? (logged/HOURS_PER_DAY) : 0;   // 保留实际计算值，不做四舍五入
}
// 对单个项目应用自动计算
function refreshProjectAutoCalc(p){
  if(!p) return;
  if(p.autoProgress!==false){
    var ap=autoCalcProgress(p.id);
    if(ap>=0) p.progress=ap;
  }
  if(p.autoWorkDays!==false){
    p.workDaysPlanned=autoCalcWorkDaysPlanned(p);
    p.workDaysUsed=autoCalcWorkDaysUsed(p);
  }
}
// 对所有项目应用自动计算
function refreshAllAutoCalc(){
  projects.forEach(refreshProjectAutoCalc);
}

/* ── Worklog 工时与工作量计算（设计文档 §3） ── */
var HOURS_PER_DAY=7.5;          // 1 人天 = 7.5 小时（登记工时按此折算为已用工作日）
var PROG_W_E=0.7, PROG_W_T=0.3; // 综合进度权重：工时为主、时间为辅

// 项目登记工时合计（小时）
function hoursUsedOfProject(pid){
  return (worklogs||[]).filter(function(w){return w.projectId===pid;}).reduce(function(s,w){return s+(+w.hours||0);},0);
}
// 任务登记工时合计（小时）
function hoursUsedOfTask(tid){
  return (worklogs||[]).filter(function(w){return w.taskId===tid;}).reduce(function(s,w){return s+(+w.hours||0);},0);
}
// 任务登记明细（时间倒序）
function worklogListByTask(tid){
  return (worklogs||[]).filter(function(w){return w.taskId===tid;}).sort(function(a,b){return (a.createdAt||a.date)<(b.createdAt||b.date)?1:-1;});
}
// 当前登记时间戳 YYYY-MM-DD HH:mm
function nowStamp(){
  var d=new Date();
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
// 小时格式化：整数不带小数，否则保留 1 位
function fmtHours(h){
  h=Math.round((+h||0)*10)/10;
  return h%1===0?String(h):h.toFixed(1);
}
// 工作日格式化：据登记工时折算，无登记为 0；整数不带小数；
// 小数**不做四舍五入**，去尾保留实际计算结果（最多 4 位），并去除尾随 0
function fmtWorkDays(d){
  d=+d||0;
  if(d===0) return '0';
  if(d%1===0) return String(d);
  return String(Math.floor(d*10000)/10000);
}
// 项目计划小时 = 计划人天 × 8
function hoursPlannedOf(p){ return (p.workDaysPlanned||0)*HOURS_PER_DAY; }
// E 工作量进度（%）登记工时/计划小时，clamp 0-100；无计划返回 -1
function calcEffortPct(p){
  var hp=hoursPlannedOf(p);
  if(hp<=0) return -1;
  return Math.min(100, Math.round(hoursUsedOfProject(p.id)/hp*100));
}
// T 时间进度（%）(今天-开始)/(截止-开始)，clamp 0-100；无起止返回 -1
function calcTimePct(p){
  if(!p.startDate||!p.endDate) return -1;
  var sd=parseDate(p.startDate), ed=parseDate(p.endDate);
  if(!isValidDate(sd)||!isValidDate(ed)) return -1;
  var today=new Date(); today.setHours(0,0,0,0);
  if(today<=sd) return 0;
  if(today>=ed) return 100;
  return Math.round(daysBetween(sd,today)/daysBetween(sd,ed)*100);
}
// P 综合工作进度：有登记工时且有计划 → E×0.7+T×0.3；否则退化为 T；均无返回 -1
function calcBlendedPct(p){
  var e=calcEffortPct(p), t=calcTimePct(p);
  if(e>=0) return t>=0 ? Math.round(e*PROG_W_E + t*PROG_W_T) : e;
  return t>=0 ? t : -1;
}
// 工时消耗率（%）登记小时/计划小时，可 >100%；无计划返回 -1
function calcBurnPct(p){
  var hp=hoursPlannedOf(p);
  if(hp<=0) return -1;
  return Math.round(hoursUsedOfProject(p.id)/hp*100);
}
// 人员工时汇总：{name:{hours, projCount, count}}
function worklogHoursByPerson(){
  var m={};
  (worklogs||[]).forEach(function(w){
    var n=w.person||'未填写';
    if(!m[n]) m[n]={hours:0,projects:{},count:0};
    m[n].hours+=(+w.hours||0);
    m[n].projects[w.projectId]=1;
    m[n].count++;
  });
  Object.keys(m).forEach(function(k){ m[k].projCount=Object.keys(m[k].projects).length; delete m[k].projects; });
  return m;
}
// 项目登记明细（按日期倒序）
function worklogListByProject(pid){
  return (worklogs||[]).filter(function(w){return w.projectId===pid;}).sort(function(a,b){return a.date<b.date?1:-1;});
}
// 全局统计
function totalLoggedHours(){ return (worklogs||[]).reduce(function(s,w){return s+(+w.hours||0);},0); }
function totalPlannedHours(){ return projects.reduce(function(s,p){return s+hoursPlannedOf(p);},0); }

/* ── Today (redesigned) ── */
function renderToday(){
  var today=new Date(); today.setHours(0,0,0,0);
  var dueTasks=[]; // 逾期/今天/3天内任务
  var dueMstones=[]; // 逾期节点

  tasks.forEach(function(t){
    if(t.status==='已完成') return;
    var dues=daysUntil(t.dueDate);
    if(isNaN(dues)||dues>3) return;
    var p=projects.find(function(x){return x.id===t.projectId;});
    var type=dues<0?'overdue':dues===0?'today':'soon';
    dueTasks.push({task:t,project:p,type:type,days:dues});
  });

  projects.forEach(function(p){
    if(p.status==='已交付'||p.status==='已暂停'||!p.milestones) return;
    p.milestones.forEach(function(m){
      var dues=daysUntil(m.date);
      if(isNaN(dues)||dues>=0) return; // 只看逾期的节点
      dueMstones.push({project:p,milestone:m,days:dues});
    });
  });

  // 排序：逾期任务 → 逾期节点 → 今天到期 → 即将到期
  dueTasks.sort(function(a,b){return a.days-b.days;});
  dueMstones.sort(function(a,b){return a.days-b.days;});

  var total=dueTasks.length+dueMstones.length;
  var wrap=document.getElementById('todayWrap');
  var badge=document.getElementById('todayBadge');
  var body=document.getElementById('todayBody');
  var hasOverdue=dueTasks.some(function(u){return u.type==='overdue';})||dueMstones.length>0;

  if(total===0){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  badge.textContent=total;
  badge.style.background=hasOverdue?'var(--danger)':'var(--warn)';

  var h='';

  // ── 逾期任务 ──
  dueTasks.filter(function(u){return u.type==='overdue';}).forEach(function(u){
    var pname=u.project?u.project.name:'';
    h+=itemHTML('overdue','逾期 '+Math.abs(u.days)+'天',u.task.name,pname,u.task.assignee||'',true,u.task.id);
  });

  // ── 逾期节点 ──
  dueMstones.forEach(function(u){
    var pname=u.project?u.project.name:'';
    h+=itemHTML('overdue','节点逾期 '+Math.abs(u.days)+'天',u.milestone.name,pname,u.milestone.date,false,null,u.project?u.project.id:null,true);
  });

  // ── 今天到期 ──
  dueTasks.filter(function(u){return u.type==='today';}).forEach(function(u){
    var pname=u.project?u.project.name:'';
    h+=itemHTML('today','今天到期',u.task.name,pname,u.task.assignee||'',true,u.task.id);
  });

  // ── 即将到期 ──
  dueTasks.filter(function(u){return u.type==='soon';}).forEach(function(u){
    var pname=u.project?u.project.name:'';
    h+=itemHTML('soon',u.days+'天后',u.task.name,pname,u.task.assignee||'',true,u.task.id);
  });

  // ── 一键完成所有逾期任务 ──
  var overdueTaskIds=dueTasks.filter(function(u){return u.type==='overdue'&&u.task;}).map(function(u){return u.task.id;});
  if(overdueTaskIds.length>=2){
    h+='<div class="today-actions"><button class="td-btn pri" onclick="batchComplete(['+overdueTaskIds.map(function(id){return"'"+id+"'";}).join(',')+'])">一键完成全部逾期任务 ('+overdueTaskIds.length+')</button></div>';
  }

  if(h==='') h='<div class="today-empty">暂无待处理项 ✓</div>';
  body.innerHTML=h;
}

function itemHTML(type,label,name,projectName,subText,showComplete,taskId,projId,isMilestone){

// 看板卡片同列拖拽排序（事件委托，桌面 HTML5 DnD；触屏从 ⠿ 手柄拖动）
function setupKanbanSort(){
  ['cards-new','cards-opt','cards-custom'].forEach(function(id){
    var box=document.getElementById(id);
    if(!box || box.dataset.sortReady) return;
    box.dataset.sortReady='1';
    box.dataset.category=id==='cards-new'?'新产品开发':id==='cards-opt'?'老产品优化':'非标项目';
    var dragId=null, dragging=null, touchDrag=null;

    function commitSort(){
      if(dragId===null) return;
      if(dragging){ dragging.classList.remove('dragging'); dragging=null; }
      var order=[];
      box.querySelectorAll('.kcard').forEach(function(c){ order.push(c.dataset.id); });
      applyProjectOrder(box.dataset.category,order);
      dragId=null;
      saveData(true);
      toast('已调整排序');
    }

    // ── 桌面：HTML5 拖拽 ──
    box.addEventListener('dragstart',function(e){
      var card=e.target.closest('.kcard'); if(!card) return;
      dragId=card.dataset.id; dragging=card;
      setTimeout(function(){ if(dragging) dragging.classList.add('dragging'); },0);
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragId);
    });

    box.addEventListener('dragover',function(e){
      e.preventDefault();
      if(!dragId) return;
      e.dataTransfer.dropEffect='move';
      var target=e.target.closest('.kcard');
      if(!target || target.dataset.id===dragId) return;
      var after=e.clientY > target.getBoundingClientRect().top + target.offsetHeight/2;
      if(after){ if(target.nextElementSibling!==dragging) box.insertBefore(dragging,target.nextElementSibling); }
      else if(target!==dragging) box.insertBefore(dragging,target);
    });

    box.addEventListener('drop',function(e){ e.preventDefault(); commitSort(); });
    box.addEventListener('dragend',commitSort);

    // ── 触屏：从 ⠿ 手柄拖动 ──
    box.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='touch' || !e.target.closest('.kcard-drag')) return;
      var card=e.target.closest('.kcard'); if(!card) return;
      touchDrag={card:card,id:card.dataset.id,startY:e.clientY,startX:e.clientX,active:false,pointerId:e.pointerId};
    });

    box.addEventListener('pointermove',function(e){
      if(!touchDrag || e.pointerId!==touchDrag.pointerId) return;
      var dy=Math.abs(e.clientY-touchDrag.startY), dx=Math.abs(e.clientX-touchDrag.startX);
      if(!touchDrag.active){
        if(dy<8 && dx<8) return;
        if(dx>dy){ touchDrag=null; return; } // 横向滑动忽略
        touchDrag.active=true;
        dragId=touchDrag.id; dragging=touchDrag.card;
        dragging.classList.add('dragging');
        dragging.style.transition='none';
        try{ dragging.setPointerCapture(e.pointerId); }catch(err){}
      }
      e.preventDefault();
      var el=document.elementFromPoint(e.clientX,e.clientY);
      var tcard=el?el.closest('.kcard'):null;
      if(tcard && tcard.dataset.id!==touchDrag.id){
        var after=e.clientY > tcard.getBoundingClientRect().top + tcard.offsetHeight/2;
        if(after){ if(tcard.nextElementSibling!==dragging) box.insertBefore(dragging,tcard.nextElementSibling); }
        else if(tcard!==dragging) box.insertBefore(dragging,tcard);
      }
    });

    function endTouch(e){
      if(!touchDrag || (e && e.pointerId!==touchDrag.pointerId)) return;
      var t=touchDrag; touchDrag=null;
      if(t.active){
        t.card.classList.remove('dragging');
        t.card.style.transition='';
        // 阻止触屏拖拽结束后误触卡片打开详情
        var block=function(ev){ ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click',block,true); };
        document.addEventListener('click',block,true);
        commitSort();
      }
    }
    box.addEventListener('pointerup',endTouch);
    box.addEventListener('pointercancel',endTouch);
  });
}

// 把某分类下的项目按拖拽后的顺序写回 projects 数组
function applyProjectOrder(category,orderedIds){
  var inCat=projects.filter(function(p){return p.category===category;});
  if(inCat.length<2) return;
  var out=projects.filter(function(p){return p.category!==category;});
  var map={}; inCat.forEach(function(p){ map[p.id]=p; });
  var list=[];
  orderedIds.forEach(function(id){ if(map[id]){ list.push(map[id]); delete map[id]; } });
  inCat.forEach(function(p){ if(map[p.id]) list.push(p); });
  projects=out.concat(list);
}

      '计划工作日：<b>'+(p.workDaysPlanned||0)+'天</b> &nbsp; 已用工作日：<b style="color:'+((p.workDaysUsed||0)>(p.workDaysPlanned||1)?'var(--danger)':'var(--text)')+'">'+fmtWorkDays(p.workDaysUsed)+'天</b>'+
      (hoursUsedOfProject(p.id)>0?' &nbsp; <span style="color:var(--text3)">(登记 '+fmtHours(hoursUsedOfProject(p.id))+' 小时 ≈ '+fmtWorkDays(hoursUsedOfProject(p.id)/HOURS_PER_DAY)+' 天)</span>':'')+
      (p.workDaysPlanned>0?' &nbsp; (消耗 '+Math.round((p.workDaysUsed||0)/p.workDaysPlanned*100)+'%)':'')+
    '</div></div>';

  if(p.desc){
    h+='<div class="detail-field"><label>描述</label><div class="val" style="font-weight:400;font-size:13px;color:var(--text2)">'+es(p.desc)+'</div></div>';
  }

  if(p.milestones && p.milestones.length>0){
    h+='<div class="detail-field"><label>关键节点</label><div class="detail-mstones">';
    p.milestones.forEach(function(m){
      var md=parseDate(m.date), cls2='future'; if(md<today) cls2='past';
      h+='<div class="detail-mstone"><span class="dot '+cls2+'"></span><span>'+es(m.name)+'</span><span style="color:var(--text3);font-size:12px;margin-left:auto">'+m.date+'</span></div>';
    });
    h+='</div></div>';
  }

  if(taskList.length>0){
    h+='<div class="detail-field"><label>关联任务 ('+taskList.length+')</label>';
    taskList.forEach(function(t){
      var done=t.status==='已完成';
      var th=hoursUsedOfTask(t.id);
      h+='<div class="task-card'+(daysUntil(t.dueDate)<0&&t.status!=='已完成'?' overdue':'')+'">'+
        '<div class="task-top"><span class="task-name" style="font-size:13px">'+es(t.name)+'</span>'+
        (th>0?'<span class="task-hours" title="已登记 '+fmtHours(th)+' 小时">⏱ '+fmtHours(th)+'h</span>':'')+
        '</div>'+
        '<div class="task-meta"><span>'+es(t.assignee||'')+'</span><span>'+t.dueDate+'</span><span style="color:var(--text3)">'+t.status+'</span></div>'+
        (t.desc?'<div style="font-size:12px;color:var(--text2);margin-top:4px;padding:4px 8px;background:var(--border-lt);border-radius:4px">'+es(t.desc)+'</div>':'')+
        '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">'+
          '<button class="btn btn-sm wl-btn" onclick="event.stopPropagation();openTaskWorklogModal(\''+t.id+'\')">⏱ 记工时</button>'+
          (done
            ?'<button class="btn btn-sm task-done-btn" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">已完成 ✓</button>'
            :'<button class="btn btn-sm task-complete-btn" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">完成</button>')+
        '</div>'+
        '</div>';
    });
    h+='</div>';
  }

  h+='<div class="detail-actions">'+
    '<button class="btn btn-primary" onclick="closeDetail();openProjectModal(\''+pid+'\')">编辑项目</button>'+
    '<button class="btn" onclick="closeDetail();openTaskModal(null,\''+pid+'\')">添加任务</button>'+
    '<button class="btn" style="color:var(--danger)" onclick="confirmDeleteProject(\''+pid+'\',\''+esc(p.name)+'\')">删除</button>'+
  '</div>';

  document.getElementById('detailPanel').innerHTML=h;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(){ document.getElementById('detailOverlay').classList.remove('open'); }

function deleteProject(pid){
  projects=projects.filter(function(p){return p.id!==pid;});
  tasks=tasks.filter(function(t){return t.projectId!==pid;});
  saveData(true); renderAll(); toast('项目已删除');
}

function confirmDeleteProject(pid, pname){
  if(!confirm('确定删除项目「'+pname+'」及其所有任务？\n此操作不可撤销。')) return;
  closeDetail();
  closeModal();
  deleteProject(pid);
}

function confirmDeleteProjectInModal(pid){
  if(!confirm('确定删除此项目及其所有任务？\n此操作不可撤销。')) return;
  closeModal();
  deleteProject(pid);
}

function confirmDeleteTask(tid){
  if(!confirm('确定删除此任务？')) return;
  tasks=tasks.filter(function(x){return x.id!==tid;});
  closeModal(); saveData(true); renderAll(); toast('已删除');
}

/* ── Gantt Chart ── */
function renderGantt(){
  // 过滤掉日期无效的项目
  var active=projects.filter(function(p){
    return p.status!=='已交付' && p.startDate && p.endDate &&
           isValidDate(parseDate(p.startDate)) && isValidDate(parseDate(p.endDate));
  });
  if(active.length===0){
    document.getElementById('ganttSvg').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p>暂无可显示的项目</p><p style="font-size:12px;margin-top:4px">需为进行中的项目设置开始和截止日期</p></div>'; return;
  }

  var catFill={'新产品开发':'#2563EB','老产品优化':'#0D9488','非标项目':'#D97706'};
  var today=new Date(); today.setHours(0,0,0,0);
  var dates=[];
  active.forEach(function(p){
    var sd=parseDate(p.startDate),ed=parseDate(p.endDate);
    if(isValidDate(sd)) dates.push(sd);
    if(isValidDate(ed)) dates.push(ed);
  });
  if(dates.length===0){ document.getElementById('ganttSvg').innerHTML='<div class="empty">日期数据异常</div>'; return; }
  var minD=new Date(Math.min.apply(null,dates.map(function(d){return d.getTime();}))); minD.setDate(minD.getDate()-3);
  var maxD=new Date(Math.max.apply(null,dates.map(function(d){return d.getTime();}))); maxD.setDate(maxD.getDate()+3);
  var totalDays=Math.max(1,Math.ceil((maxD-minD)/(1000*60*60*24)));

  var labelW=130, colH=40, headerH=40;
  var availW=window.innerWidth-32;
  var dayW=Math.max(4,Math.min(20,Math.floor((availW-labelW)/totalDays)));
  var chartW=totalDays*dayW, svgW=labelW+chartW+10, svgH=headerH+active.length*colH+10;

  var svg='<svg viewBox="0 0 '+svgW+' '+svgH+'" width="'+svgW+'" height="'+svgH+'" style="display:block">';
  svg+='<rect width="'+svgW+'" height="'+svgH+'" fill="#fff"/>';

  // Header bg
  svg+='<rect x="0" y="0" width="'+svgW+'" height="'+headerH+'" fill="#F8FAFC"/>';
  svg+='<line x1="0" y1="'+headerH+'" x2="'+svgW+'" y2="'+headerH+'" stroke="#E2E8F0"/>';
  svg+='<line x1="'+labelW+'" y1="0" x2="'+labelW+'" y2="'+svgH+'" stroke="#E2E8F0"/>';

  // Month/week labels + grid
  var curM=-1,curW=-1;
  for(var d=0;d<totalDays;d++){
    var dd=new Date(minD); dd.setDate(dd.getDate()+d);
    var mx=labelW+d*dayW;
    // Month label
    if(dd.getMonth()!==curM){
      curM=dd.getMonth();
      svg+='<text x="'+(mx+2)+'" y="'+(headerH-18)+'" font-size="10" fill="#64748B" font-family="sans-serif" font-weight="600">'+(dd.getMonth()+1)+'月</text>';
      svg+='<line x1="'+mx+'" y1="'+headerH+'" x2="'+mx+'" y2="'+svgH+'" stroke="#E2E8F0" stroke-width="1"/>';
    }
    // Week separator (every Monday)
    var weekNum=Math.floor(d/7);
    if(weekNum!==curW && d>0){
      curW=weekNum;
      svg+='<line x1="'+mx+'" y1="'+headerH+'" x2="'+mx+'" y2="'+svgH+'" stroke="#F1F5F9" stroke-width="0.5"/>';
    }
    // Date label (every 7 days or if dayW is wide enough)
    if(dayW>=12 || d%7===0){
      svg+='<text x="'+(mx+dayW/2)+'" y="'+(headerH-5)+'" font-size="8" fill="#94A3B8" text-anchor="middle" font-family="sans-serif">'+dd.getDate()+'</text>';
    }
  }

  // Today line
  var todayOffset=daysBetween(minD,today);
  if(todayOffset>=0 && todayOffset<=totalDays){
    var todayX=labelW+todayOffset*dayW+dayW/2;
    svg+='<line x1="'+todayX+'" y1="'+headerH+'" x2="'+todayX+'" y2="'+svgH+'" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>';
    svg+='<rect x="'+(todayX-16)+'" y="'+(headerH-16)+'" width="32" height="13" rx="3" fill="#EF4444"/>';
    svg+='<text x="'+todayX+'" y="'+(headerH-5)+'" font-size="9" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">今天</text>';
  }

  // Project bars
  active.forEach(function(p,ri){
    var y=headerH+ri*colH, barY=y+9, barH=colH-18;
    var sd=parseDate(p.startDate), ed=parseDate(p.endDate);
    var sOffset=daysBetween(minD,sd), eOffset=daysBetween(minD,ed);
    var sx=labelW+sOffset*dayW;
    var ex=labelW+eOffset*dayW+dayW;
    var bw=Math.max(ex-sx,dayW*2);
    var fill=catFill[p.category]||'#2563EB';
    var opacity=p.status==='已暂停'?0.4:1;
    var isOverdue=daysUntil(p.endDate)<0 && p.status!=='已暂停';

    // Row bg (alternating)
    if(ri%2===1) svg+='<rect x="0" y="'+y+'" width="'+svgW+'" height="'+colH+'" fill="#F8FAFC" opacity="0.5"/>';

    // Label
    var shortName=p.name.length>10?p.name.substr(0,10)+'…':p.name;
    svg+='<text x="6" y="'+(y+colH/2+4)+'" font-size="11" fill="#0F172A" font-family="sans-serif" font-weight="600">'+es(shortName)+'</text>';

    // Bar background
    svg+='<rect x="'+sx+'" y="'+barY+'" width="'+bw+'" height="'+barH+'" rx="4" fill="'+fill+'" fill-opacity="0.15" opacity="'+opacity+'"/>';

    // Progress fill
    var progW=Math.round(bw*(p.progress||0)/100);
    if(progW>0) svg+='<rect x="'+sx+'" y="'+barY+'" width="'+progW+'" height="'+barH+'" rx="4" fill="'+fill+'" fill-opacity="0.6" opacity="'+opacity+'"/>';

    // Progress text
    if(bw>45) svg+='<text x="'+(sx+bw/2)+'" y="'+(barY+barH/2+3.5)+'" font-size="9" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700" opacity="'+opacity+'">'+(p.progress||0)+'%</text>';

    // Overdue indicator
    if(isOverdue){
      svg+='<rect x="'+(ex-2)+'" y="'+(barY-2)+'" width="4" height="'+(barH+4)+'" rx="1" fill="#EF4444"/>';
    }

    // Milestones
    if(p.milestones) p.milestones.forEach(function(m){
      var md=parseDate(m.date);
      if(!isValidDate(md)) return;
      var mOffset=daysBetween(minD,md);
      if(mOffset<0||mOffset>totalDays) return;
      var mx=labelW+mOffset*dayW+dayW/2;
      var my=y+colH/2;
      svg+='<polygon points="'+mx+','+(my-5)+' '+(mx+4)+','+my+' '+mx+','+(my+5)+' '+(mx-4)+','+my+'" fill="#F59E0B" stroke="#fff" stroke-width="1"/>';
    });

    // Click area
    svg+='<rect x="'+sx+'" y="'+barY+'" width="'+bw+'" height="'+barH+'" fill="transparent" style="cursor:pointer" onclick="showDetail(\''+p.id+'\')"/>';
    // Label click area
    svg+='<rect x="0" y="'+y+'" width="'+labelW+'" height="'+colH+'" fill="transparent" style="cursor:pointer" onclick="showDetail(\''+p.id+'\')"/>';
  });

  svg+='</svg>';
  document.getElementById('ganttSvg').innerHTML=svg;
}

/* ── Task List ── */
function renderTasks(){
  // 先渲染姓名筛选 chips
  var names=[];
  tasks.forEach(function(t){ if(t.assignee && names.indexOf(t.assignee)===-1) names.push(t.assignee); });
  var nameChips='<button class="chip'+(taskNameFilter==='all'?' active':'')+'" onclick="setNameFilter(\'all\')">全部人员</button>';
  names.forEach(function(n){
    nameChips+='<button class="chip'+(taskNameFilter===n?' active':'')+'" onclick="setNameFilter(\''+esc(n)+'\')">'+es(n)+'</button>';
  });
  document.getElementById('taskNameFilter').innerHTML=nameChips;

  var filtered=tasks;
  if(taskFilter!=='all') filtered=filtered.filter(function(t){return t.status===taskFilter;});
  if(taskNameFilter!=='all') filtered=filtered.filter(function(t){return t.assignee===taskNameFilter;});
  var h='';
  if(filtered.length===0) h='<div class="empty">暂无匹配任务</div>';
  else filtered.forEach(function(t){
    var p=projects.find(function(x){return x.id===t.projectId;});
    var dues=daysUntil(t.dueDate), done=t.status==='已完成';
    var cls='task-card'+(dues<0&&!done?' overdue':'');
    var th=hoursUsedOfTask(t.id);
    h+='<div class="'+cls+'">'+
      '<div class="task-top"><span class="task-name">'+es(t.name)+'</span>'+
      (th>0?'<span class="task-hours" title="该任务已登记 '+fmtHours(th)+' 小时（约 '+fmtWorkDays(th/HOURS_PER_DAY)+' 个工作日）">⏱ '+fmtHours(th)+'h</span>':'')+
      '</div>'+
      '<div class="task-meta">'+
        '<span>'+es(t.assignee||'未分配')+'</span><span>'+t.dueDate+'</span>'+
        (dues<0&&!done?'<span style="color:var(--danger);font-weight:600">逾期'+Math.abs(dues)+'天</span>':'')+
        (dues===0&&!done?'<span style="color:var(--warn);font-weight:600">今天到期</span>':'')+
      '</div>';
    if(p) h+='<div class="task-project" style="color:'+(p.category==='新产品开发'?'var(--blue)':p.category==='老产品优化'?'var(--teal)':'var(--amber)')+'">'+es(p.name)+'</div>';
    if(t.desc) h+='<div style="font-size:12px;color:var(--text2);margin-top:4px;padding:4px 8px;background:var(--border-lt);border-radius:4px">'+es(t.desc)+'</div>';
    h+='<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">'+
      '<button class="btn btn-sm wl-btn" onclick="openTaskWorklogModal(\''+t.id+'\')">⏱ 记工时</button>'+
      (done
        ?'<button class="btn btn-sm task-done-btn" onclick="toggleTask(\''+t.id+'\')">已完成 ✓</button>'
        :'<button class="btn btn-sm task-complete-btn" onclick="toggleTask(\''+t.id+'\')">完成</button>')+
      '<button class="btn btn-sm" onclick="openTaskModal(\''+t.id+'\')">编辑</button>'+
      '<button class="btn btn-sm" style="color:var(--danger);border-color:transparent" onclick="confirmDeleteTask(\''+t.id+'\')">删除</button>'+
    '</div></div>';
  });
  document.getElementById('taskList').innerHTML=h;
}

/* ── Stats View ── */
function renderStatsView(){
  var today=new Date(); today.setHours(0,0,0,0);

  // ── 聚合数据 ──
  var totalTasks=tasks.length;
  var doneTasks=tasks.filter(function(t){return t.status==='已完成';}).length;
  var overdueTasks=tasks.filter(function(t){return t.status!=='已完成' && daysUntil(t.dueDate)<0;}).length;
  var inProgress=tasks.filter(function(t){return t.status==='进行中';}).length;
  var pending=tasks.filter(function(t){return t.status==='待开始';}).length;
  var taskRate=totalTasks?Math.round(doneTasks/totalTasks*100):0;

  // 按人员统计
  var personMap={};
  tasks.forEach(function(t){
    var name=t.assignee||'未分配';
    if(!personMap[name]) personMap[name]={total:0,done:0,inProgress:0,pending:0,overdue:0};
    personMap[name].total++;
    if(t.status==='已完成') personMap[name].done++;
    else if(t.status==='进行中') personMap[name].inProgress++;
    else personMap[name].pending++;
    if(t.status!=='已完成' && daysUntil(t.dueDate)<0) personMap[name].overdue++;
  });

  // 按项目统计
  var projStats=[];
  projects.forEach(function(p){
    var pt=tasks.filter(function(t){return t.projectId===p.id;});
    var done=pt.filter(function(t){return t.status==='已完成';}).length;
    var ovd=pt.filter(function(t){return t.status!=='已完成' && daysUntil(t.dueDate)<0;}).length;
    projStats.push({
      id:p.id, name:p.name, cat:p.category, status:p.status,
      total:pt.length, done:done, overdue:ovd,
      pct:pt.length?Math.round(done/pt.length*100):0,
      wPlan:p.workDaysPlanned||0, wUsed:p.workDaysUsed||0
    });
  });

  var persons=Object.keys(personMap).sort(function(a,b){return personMap[b].total-personMap[a].total;});
  var totalPlanned=projects.reduce(function(s,p){return s+(p.workDaysPlanned||0);},0);
  var totalUsed=projects.reduce(function(s,p){return s+(p.workDaysUsed||0);},0);

  // 颜色辅助
  function barColor(pct){ return pct>=80?'#10B981':pct>=50?'#F59E0B':'#EF4444'; }
  function catColor(c){ return c==='新产品开发'?'var(--blue)':c==='老产品优化'?'var(--teal)':'var(--amber)'; }

  var h='';

  // ── 1. 整体概览卡片 ──
  h+='<div style="margin-bottom:18px;font-size:16px;font-weight:700;color:var(--text)">整体概览</div>';
  h+='<div class="stats-cards">'+
    '<div class="scard"><div class="scard-num">'+totalTasks+'</div><div class="scard-label">任务总数</div></div>'+
    '<div class="scard done"><div class="scard-num">'+doneTasks+'</div><div class="scard-label">已完成</div></div>'+
    '<div class="scard warn"><div class="scard-num">'+inProgress+'</div><div class="scard-label">进行中</div></div>'+
    '<div class="scard danger"><div class="scard-num">'+overdueTasks+'</div><div class="scard-label">已逾期</div></div>'+
    '<div class="scard"><div class="scard-num">'+taskRate+'%</div><div class="scard-label">完成率</div></div>'+
    '<div class="scard"><div class="scard-num">'+persons.length+'</div><div class="scard-label">参与人数</div></div>'+
  '</div>';

  // ── 1.5 工时总览（登记工时 / 计划工时 / 消耗率）──
  var tLog=totalLoggedHours(), tPlan=totalPlannedHours();
  var globalBurn=tPlan>0?Math.round(tLog/tPlan*100):0;
  h+='<div style="margin:16px 0 14px;font-size:16px;font-weight:700;color:var(--text)">工时总览</div>';
  h+='<div class="wl-stat-grid">'+
    '<div class="wl-stat"><div class="wl-stat-num">'+tLog+'<span style="font-size:12px">h</span></div><div class="wl-stat-label">登记工时合计</div></div>'+
    '<div class="wl-stat"><div class="wl-stat-num">'+tPlan+'<span style="font-size:12px">h</span></div><div class="wl-stat-label">计划工时合计</div></div>'+
    '<div class="wl-stat"><div class="wl-stat-num">'+(tPlan?globalBurn+'%':'—')+'</div><div class="wl-stat-label">全局消耗率</div></div>'+
    '<div class="wl-stat"><div class="wl-stat-num">'+(worklogs||[]).length+'</div><div class="wl-stat-label">登记笔数</div></div>'+
  '</div>';
  if(tPlan>0){
    h+='<div style="height:8px;background:var(--border-lt);border-radius:4px;margin-bottom:16px;overflow:hidden">'+
      '<div style="height:100%;width:'+Math.min(globalBurn,100)+'%;background:'+(globalBurn>100?'var(--danger)':'var(--teal)')+';border-radius:4px;transition:width .4s"></div></div>'+
      '<div style="font-size:12px;color:var(--text2);margin-bottom:16px">消耗率 100% = 计划工时刚好用完'+(globalBurn>100?'，<span style="color:var(--danger);font-weight:600">已超支 '+(globalBurn-100)+'%</span>':'')+'</div>';
  }

  // ── 整体工作量 ──
  if(totalPlanned>0){
    var wPct=Math.round(totalUsed/totalPlanned*100);
    h+='<div style="margin:16px 0 8px;font-size:13px;color:var(--text2)">总工时消耗：<b>'+fmtWorkDays(totalUsed)+'</b> / <b>'+totalPlanned+'</b> 天（'+wPct+'%，按 7.5 小时=1 天折算）</div>';
    h+='<div style="height:8px;background:var(--border-lt);border-radius:4px;margin-bottom:16px;overflow:hidden">'+
      '<div style="height:100%;width:'+Math.min(wPct,100)+'%;background:'+barColor(100-wPct)+';border-radius:4px;transition:width .4s"></div></div>';
  }

  // ── 2. 人员工作量统计 ──
  h+='<div style="margin-bottom:14px;font-size:16px;font-weight:700;color:var(--text)">人员工作量</div>';

  if(persons.length===0){
    h+='<div class="empty">暂无任务数据</div>';
  } else {
    persons.forEach(function(name){
      var m=personMap[name];
      var rate=m.total?Math.round(m.done/m.total*100):0;
      var pendPct=m.total?Math.round(m.pending/m.total*100):0;
      var inProgPct=m.total?Math.round(m.inProgress/m.total*100):0;
      var donePct=m.total?Math.round(m.done/m.total*100):0;
      h+='<div class="person-card">'+
        '<div class="person-top">'+
          '<span class="person-name">'+es(name)+'</span>'+
          '<span class="person-rate" style="color:'+barColor(100-rate)+'">'+rate+'%</span>'+
        '</div>'+
        '<div class="person-bar-wrap">'+
          (pendPct>0?'<div class="person-bar pending" style="width:'+pendPct+'%" title="待开始 '+m.pending+'"></div>':'')+
          (inProgPct>0?'<div class="person-bar inprog" style="width:'+inProgPct+'%" title="进行中 '+m.inProgress+'"></div>':'')+
          (donePct>0?'<div class="person-bar done" style="width:'+donePct+'%" title="已完成 '+m.done+'"></div>':'')+
        '</div>'+
        '<div class="person-stats">'+
          '<span>共 '+m.total+' 项</span>'+
          '<span style="color:var(--success)">完成 '+m.done+'</span>'+
          (m.inProgress>0?'<span style="color:var(--warn)">进行 '+m.inProgress+'</span>':'')+
          (m.overdue>0?'<span style="color:var(--danger)">逾期 '+m.overdue+'</span>':'')+
        '</div>'+
      '</div>';
    });
  }

  // ── 2.5 人员工时排行（按登记工时）──
  h+='<div style="margin:20px 0 14px;font-size:16px;font-weight:700;color:var(--text)">人员工时排行</div>';
  var wpm=worklogHoursByPerson(), wnames=Object.keys(wpm).sort(function(a,b){return wpm[b].hours-wpm[a].hours;});
  if(!wnames.length){
    h+='<div class="empty">暂无工时登记，点击顶部「记工时」录入</div>';
  } else {
    var maxH=Math.max.apply(null,wnames.map(function(n){return wpm[n].hours;}))||1;
    wnames.forEach(function(n){
      var m=wpm[n];
      var pct=Math.round(m.hours/maxH*100);
      h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border-lt)">'+
        '<span style="width:70px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+es(n)+'</span>'+
        '<div style="flex:1;height:8px;background:var(--border-lt);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:4px;transition:width .4s"></div></div>'+
        '<span style="font-size:12px;font-weight:700;min-width:64px;text-align:right">'+m.hours+'h</span>'+
        '<span style="font-size:11px;color:var(--text3);min-width:52px;text-align:right">'+m.projCount+' 项目</span>'+
      '</div>';
    });
  }

  // ── 3. 项目任务完成情况 ──
  h+='<div style="margin:20px 0 14px;font-size:16px;font-weight:700;color:var(--text)">项目任务完成</div>';

  if(projStats.length===0){
    h+='<div class="empty">暂无项目数据</div>';
  } else {
    projStats.sort(function(a,b){return b.total-a.total;});
    projStats.forEach(function(ps){
      h+='<div class="proj-stat-card">'+
        '<div class="proj-stat-top">'+
          '<span class="proj-stat-name">'+es(ps.name)+'</span>'+
          '<span class="proj-stat-cat" style="background:'+catColor(ps.cat)+'10;color:'+catColor(ps.cat)+'">'+es(ps.cat)+'</span>'+
          (ps.status==='已暂停'?'<span style="font-size:11px;color:var(--text3)">已暂停</span>':'')+
        '</div>';
      if(ps.total>0){
        h+='<div style="margin:8px 0;display:flex;align-items:center;gap:8px">'+
          '<div style="flex:1;height:6px;background:var(--border-lt);border-radius:3px;overflow:hidden">'+
            '<div style="height:100%;width:'+ps.pct+'%;background:'+barColor(100-ps.pct)+';border-radius:3px;transition:width .4s"></div>'+
          '</div>'+
          '<span style="font-size:12px;font-weight:700;min-width:36px;text-align:right;color:'+barColor(100-ps.pct)+'">'+ps.pct+'%</span>'+
        '</div>'+
        '<div style="font-size:12px;color:var(--text2)">任务 '+ps.done+'/'+ps.total+
          (ps.overdue>0?' <span style="color:var(--danger)">(逾期 '+ps.overdue+')</span>':'')+
        '</div>';
      } else {
        h+='<div style="font-size:12px;color:var(--text3)">暂无任务</div>';
      }
      // 工时对比：登记 vs 计划（小时），工作量进度 E / 时间进度 T / 综合进度
      var hUsed=hoursUsedOfProject(ps.id), hPlan=hoursPlannedOf(ps);
      var ePct=calcEffortPct(ps), tPct=calcTimePct(ps), burn=calcBurnPct(ps);
      if(hPlan>0||hUsed>0){
        h+='<div style="margin-top:8px;font-size:12px;color:var(--text2)">'+
          '工时对比：<b>'+hUsed+'h</b> / <b>'+hPlan+'h</b>'+
          (burn>=0?'（消耗 '+burn+'%'+'）':'')+
          (burn>100?' <span style="color:var(--danger);font-weight:600">🔴 超支 '+(burn-100)+'%</span>':'')+
        '</div>';
        if(burn>=0){
          h+='<div class="wl-compare"><div class="wl-bar">'+
            '<div class="wl-bar-fill" style="width:'+Math.min(burn,100)+'%;background:'+(burn>100?'var(--danger)':'var(--blue)')+'"></div>'+
          '</div></div>';
        }
        if(ePct>=0||tPct>=0){
          h+='<div style="margin-top:4px;font-size:12px;color:var(--text2)">'+
            (ePct>=0?'工作量进度 <b style="color:'+(ePct>=100?'var(--success)':'var(--text)')+'">'+ePct+'%</b>':'')+
            (tPct>=0?' · 时间进度 <b>'+tPct+'%</b>':'')+
            (ePct>=0&&tPct>=0?' · 综合 <b>'+Math.round(ePct*PROG_W_E+tPct*PROG_W_T)+'%</b>':'')+
            (ePct>=0&&tPct>=0&&(ePct-tPct)<-15&&ePct<100?' <span style="color:var(--amber)">🟠 进度滞后</span>':'')+
            (ePct>=0&&tPct>=0&&(ePct-tPct)>=15?' <span style="color:var(--success)">🟢 超前</span>':'')+
          '</div>';
        }
      }
      h+='</div>';
    });
  }

  document.getElementById('statsContent').innerHTML=h;
}

// 进度模式切换
function setProgMode(auto){
  _autoProg=auto;
  document.getElementById('progAutoBtn').classList.toggle('active',auto);
  document.getElementById('progManualBtn').classList.toggle('active',!auto);
  updateProgAutoCalc();
  scheduleAutoSave();

function updateProgAutoCalc(){
  var progInput=document.getElementById('modPProg');
  var progHint=document.getElementById('progHint');
  if(!progInput||!progHint) return;
  if(_autoProg){
    var ap=autoCalcProgress(editingProjId);
    if(ap>=0){
      var pt=tasks.filter(function(t){return t.projectId===editingProjId;});
      var done=pt.filter(function(t){return t.status==='已完成';}).length;
      progInput.value=ap;
      progInput.classList.add('input-disabled');
      progHint.className='auto-calc-hint ok';
      progHint.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>根据任务完成率自动计算：'+done+'/'+pt.length+' 任务完成 ('+ap+'%)';
    } else {
      // 无任务时按时间进度
      var sd=(document.getElementById('modPStart')||{}).value||'';
      var ed=(document.getElementById('modPEnd')||{}).value||'';
      if(sd&&ed&&isValidDate(parseDate(sd))&&isValidDate(parseDate(ed))){
        var today=new Date(); today.setHours(0,0,0,0);
        var total=daysBetween(parseDate(sd),parseDate(ed));
        var elapsed=daysBetween(parseDate(sd),today);
        var tp=elapsed<=0?0:elapsed>=total?100:Math.round(elapsed/total*100);
        progInput.value=tp;
        progInput.classList.add('input-disabled');
        progHint.className='auto-calc-hint ok';
        progHint.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>暂无任务，按时间进度计算：'+elapsed+'/'+total+' 天 ('+tp+'%)';
      } else {
        progInput.classList.remove('input-disabled');
        progHint.className='auto-calc-hint warn';
        progHint.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>暂无任务和日期，请先添加任务或设置日期，或切换为手动输入';
      }
    }
  } else {
    progInput.classList.remove('input-disabled');
    progHint.className='auto-calc-hint';
    progHint.textContent='手动输入进度百分比（0-100）';
  }
}

// 工时模式切换
function setWorkMode(auto){
  _autoWork=auto;
  document.getElementById('workAutoBtn').classList.toggle('active',auto);
  document.getElementById('workManualBtn').classList.toggle('active',!auto);
  updateWorkAutoCalc();
  scheduleAutoSave();
}
function updateWorkAutoCalc(){
  var wPlanInput=document.getElementById('modPWPlan');
  var wUsedInput=document.getElementById('modPWUsed');
  var workHint=document.getElementById('workHint');
  var dateHint=document.getElementById('dateHint');
  if(!wPlanInput||!wUsedInput) return;

  var sd=(document.getElementById('modPStart')||{}).value||'';
  var ed=(document.getElementById('modPEnd')||{}).value||'';

  // 更新日期提示
  if(sd&&ed&&isValidDate(parseDate(sd))&&isValidDate(parseDate(ed))){
    var totalDays=daysBetween(parseDate(sd),parseDate(ed));
    var planned=bizDaysBetween(parseDate(sd),parseDate(ed));
    dateHint.textContent='工期：'+totalDays+' 天 / '+planned+' 个工作日（不含周末）';
    dateHint.classList.remove('warn');
  } else {
    dateHint.textContent='请设置开始和截止日期以自动计算工期';
    dateHint.classList.add('warn');
  }

  if(_autoWork){
    var planned2=autoCalcWorkDaysPlanned({startDate:sd,endDate:ed});
    var usedProj=projects.find(function(x){return x.id===editingProjId;})||{};
    var used2=autoCalcWorkDaysUsed(usedProj);
    wPlanInput.value=planned2;
    wUsedInput.value=used2;
    wPlanInput.classList.add('input-disabled');
    wUsedInput.classList.add('input-disabled');
    if(workHint){
      workHint.className='auto-calc-hint ok';
      workHint.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>计划 '+planned2+' 工作日 | 已用 '+fmtWorkDays(used2)+' 工作日（按登记工时÷7.5 折算，无登记为 0）';
    }
  } else {
    wPlanInput.classList.remove('input-disabled');
    wUsedInput.classList.remove('input-disabled');
    if(workHint){
      workHint.className='auto-calc-hint';
      workHint.textContent='手动输入工作日天数';
    }
  }
}

function renderMilestoneInputs(){
  var h='';
  editingMilestones.forEach(function(m,i){
    h+='<div class="milestone-row"><input value="'+es(m.name)+'" data-mi="'+i+'" data-field="name" placeholder="节点名称" oninput="scheduleAutoSave()"><input type="date" value="'+m.date+'" data-mi="'+i+'" data-field="date" style="max-width:140px" onchange="scheduleAutoSave()"><button class="btn btn-sm" style="color:var(--danger)" onclick="removeMilestone('+i+')">×</button></div>';
  });
  document.getElementById('modMilestones').innerHTML=h;
}

function syncMilestones(){
  document.querySelectorAll('#modMilestones input').forEach(function(inp){
    var i=parseInt(inp.dataset.mi), field=inp.dataset.field;
    if(!isNaN(i) && editingMilestones[i]) editingMilestones[i][field]=inp.value;
  });
}

function addMilestone(){
  editingMilestones.push({name:'',date:todayStr()});
  renderMilestoneInputs();
}

function removeMilestone(idx){
  editingMilestones.splice(idx,1); renderMilestoneInputs();
}

function saveProject(){

  var name=(document.getElementById('modPName').value||'').trim();

// 保存登记（立即同步后端）；编辑模式下更新原记录
function saveWorklog(){
  var editId=(document.getElementById('wlEditId')||{}).value||'';
  var pid=document.getElementById('wlProj').value;
  var person=(document.getElementById('wlPerson').value||'').trim();
  var date=document.getElementById('wlDate').value;
  var hours=parseFloat(document.getElementById('wlHours').value);
  var note=(document.getElementById('wlNote').value||'').trim();
  if(!pid){ toast('请选择项目'); return; }
  if(!person){ toast('请填写记录人'); return; }
  if(!date){ toast('请选择日期'); return; }
  if(!hours||isNaN(hours)||hours<=0){ toast('请填写正确的工时数'); return; }
  if(editId){
    var w=worklogs.find(function(x){return x.id===editId;}); if(!w) return;
    var oldPid=w.projectId;
    w.projectId=pid; w.person=person; w.date=date; w.hours=hours; w.note=note; // 保留原登记时间 createdAt
    var oldP=projects.find(function(x){return x.id===oldPid;});
    var newP=projects.find(function(x){return x.id===pid;});
    if(oldP && oldP!==newP && oldP.autoProgress!==false) refreshProjectAutoCalc(oldP);
    if(newP && newP.autoProgress!==false) refreshProjectAutoCalc(newP);
    saveData(true);
    renderAll();
    renderWorklogRecent();
    document.getElementById('wlHours').value='';
    document.getElementById('wlNote').value='';
    document.getElementById('wlEditId').value='';
    toast('已更新登记 ✓');
  } else {
    worklogs.push({id:genId(), projectId:pid, person:person, date:date, createdAt:nowStamp(), hours:hours, note:note});
    // 自动进度项目：用新规则（工时优先）刷新
    var p=projects.find(function(x){return x.id===pid;});
    if(p && p.autoProgress!==false){ refreshProjectAutoCalc(p); }
    saveData(true);
    renderAll();
    renderWorklogRecent();
    document.getElementById('wlHours').value='';
    document.getElementById('wlNote').value='';
    toast('已登记 '+person+' '+hours+' 小时 ✓');
  }
}

function buildProjRows(){
  return projects.map(function(p,i){
    var mstones=(p.milestones||[]).map(function(m){return m.name+' ('+m.date+')';}).join('、');
    return {
      '编号':i+1,
      '项目名称':p.name||'',
      '分类':p.category||'',
      '状态':p.status||'',
      '优先级':p.priority||'',
      '负责人':p.owner||'',
      '开始日期':p.startDate||'',
      '截止日期':p.endDate||'',
      '进度%':p.progress||0,
      '计划工作日':p.workDaysPlanned||0,
      '已用工作日':fmtWorkDays(p.workDaysUsed||0),
      '工时消耗%':(p.workDaysPlanned>0?Math.round((p.workDaysUsed||0)/p.workDaysPlanned*100):0),
      '进度方式':p.autoProgress===false?'手动':'自动',
      '工时方式':p.autoWorkDays===false?'手动':'自动',
      '关键节点':mstones,
      '描述':p.desc||''
    };
  });
}
function buildTaskRows(){
  return tasks.map(function(t,i){
    var pr=projects.find(function(x){return x.id===t.projectId;});
    return {
      '编号':i+1,
      '所属项目':pr?pr.name:'',
      '项目分类':pr?pr.category:'',
      '任务名称':t.name||'',
      '负责人':t.assignee||'',
      '截止日期':t.dueDate||'',
      '状态':t.status||'',
      '描述':t.desc||''
    };
  });
}
function buildMsRows(){
  var rows=[];
  projects.forEach(function(p){
    (p.milestones||[]).forEach(function(m){
      rows.push({'项目名称':p.name||'','节点名称':m.name||'','节点日期':m.date||''});
    });
  });
  return rows;
}
function buildWorklogRows(){
  var pmap={}; projects.forEach(function(p){ pmap[p.id]=p.name; });
  var tmap={}; tasks.forEach(function(t){ tmap[t.id]=t.name; });
  var rows=(worklogs||[]).slice().sort(function(a,b){return (a.createdAt||a.date)<(b.createdAt||b.date)?1:-1;}).map(function(w){
    return {
      '项目名称':pmap[w.projectId]||'未知项目',
      '关联任务':w.taskId?(tmap[w.taskId]||''):'',
      '记录人':w.person||'',
      '登记日期':w.date||'',
      '登记时间':w.createdAt||'',
      '工时(小时)':(+w.hours||0),
      '折算工作日':Math.round((+w.hours||0)/HOURS_PER_DAY*10)/10,
      '备注':w.note||''
    };
  });
  return rows;
}
function buildStatsRows(){
  var done=tasks.filter(function(t){return t.status==='已完成';}).length;
  var delivered=projects.filter(function(p){return p.status==='已交付';}).length;
  var rows=[
    {'统计项':'项目总数','数值':projects.length},
    {'统计项':'任务总数','数值':tasks.length},
    {'统计项':'已完成任务','数值':done},
    {'统计项':'任务完成率','数值':tasks.length?Math.round(done/tasks.length*100)+'%':'0%'},
    {'统计项':'已交付项目','数值':delivered},
    {'统计项':'项目交付率','数值':projects.length?Math.round(delivered/projects.length*100)+'%':'0%'}
  ];
  var personMap={};
  projects.forEach(function(p){
    var o=p.owner||'未分配';
    personMap[o]=personMap[o]||{planned:0,used:0,count:0};
    personMap[o].planned+=p.workDaysPlanned||0;
    personMap[o].used+=p.workDaysUsed||0;
    personMap[o].count++;
  });
  Object.keys(personMap).forEach(function(k){
    var v=personMap[k];
    rows.push({'统计项':'负责人：'+k,'数值':'项目 '+v.count+' 个 · 计划 '+v.planned+' 天 · 已用 '+fmtWorkDays(v.used)+' 天'});
  });
  return rows;
}

function downloadFile(content,filename,type){
  var blob=new Blob([content],{type:type||'application/octet-stream'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
}
function downloadCsv(rows,filename){
  if(!rows.length) rows=[{'提示':'暂无数据'}];
  var head=Object.keys(rows[0]);
  var lines=[head.join(',')];
  rows.forEach(function(r){
    lines.push(head.map(function(k){
      var v=r[k]===undefined?'':String(r[k]);
      return '"'+v.replace(/"/g,'""')+'"';
    }).join(','));
  });
  downloadFile('\ufeff'+lines.join('\r\n'),filename,'text/csv;charset=utf-8');
}

function exportExcel(){
  var projRows=buildProjRows(), taskRows=buildTaskRows(), msRows=buildMsRows(), statsRows=buildStatsRows(), wlRows=buildWorklogRows();
  var loadLib=function(cb){
    if(window.XLSX){ cb(true); return; }
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=function(){ cb(true); };
    s.onerror=function(){ cb(false); };
    document.head.appendChild(s);
  };
  loadLib(function(ok){
    if(!ok){ // 无网络：回退 CSV（Excel 可直接打开）
      downloadCsv(projRows,'图书馆研发工作台_项目表_'+todayStr()+'.csv');
      downloadCsv(taskRows,'图书馆研发工作台_任务表_'+todayStr()+'.csv');
      if(msRows.length) downloadCsv(msRows,'图书馆研发工作台_关键节点_'+todayStr()+'.csv');
      downloadCsv(wlRows,'图书馆研发工作台_工时登记_'+todayStr()+'.csv');
      downloadCsv(statsRows,'图书馆研发工作台_统计汇总_'+todayStr()+'.csv');
      toast('离线模式，已导出 5 个 CSV 文件（Excel 可打开）');
      return;
    }
    var wb=XLSX.utils.book_new();
    function addSheet(name,rows){
      if(!rows.length) rows=[{'提示':'暂无数据'}];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name);
    }
    addSheet('项目总表',projRows);
    addSheet('任务明细',taskRows);
    addSheet('工时登记',wlRows);
    addSheet('关键节点',msRows);
    addSheet('统计汇总',statsRows);
    XLSX.writeFile(wb,'图书馆研发工作台_数据_'+todayStr()+'.xlsx');
    toast('已导出 Excel（5 个工作表）');
  });
}

function exportData(){
  var data={projects:projects,tasks:tasks,worklogs:worklogs||[],exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='图书馆研发工作台_备份_'+todayStr()+'.json'; a.click(); toast('已导出');
}

function importData(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.projects || !Array.isArray(data.projects)) throw new Error('格式错误');
      var count=data.projects.length+ (data.tasks?data.tasks.length:0)+ (data.worklogs?data.worklogs.length:0);
      if(!confirm('即将导入 '+count+' 条数据，当前数据将被覆盖。确定继续？')){ input.value=''; return; }
      projects=data.projects; tasks=data.tasks||[]; worklogs=Array.isArray(data.worklogs)?data.worklogs:[];
      saveData(); renderAll(); toast('已导入 '+count+' 条数据');
    }catch(err){ toast('导入失败：文件格式不正确'); }
    input.value='';
  };
  reader.readAsText(file);
}
